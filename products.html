<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js"></script>
  <title>Products | Maruti Electricals</title>
</head>

<body>

  <div id="siteHeader"></div>

  <main>
    <section class="page-hero products-hero">
      <div class="container page-hero-inner">
        <span class="eyebrow light">Product Catalogue</span>
        <h1>Our Products</h1>
        <p>Explore our range of electrical materials and trusted brands.</p>
      </div>
    </section>

    <section class="section products-page">
      <div class="container">

        <div class="products-intro">
          <span class="eyebrow">Electrical Materials</span>
          <h2>Home Wires</h2>
          <p>Choose from trusted wire brands available at Maruti Electricals.</p>
        </div>

        <div class="product-grid catalogue-grid" id="productGrid"></div>

      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script>
    document.getElementById("siteHeader").innerHTML = header("Products");
    document.getElementById("siteFooter").innerHTML = footer();

    const wires = [
      ["Polycab", "POLYCAB"],
      ["KEI", "KEI"],
      ["Havells", "HAVELLS"],
      ["Finolex", "FINOLEX"]
    ];

    document.getElementById("productGrid").innerHTML =
      wires.map(w => `
        <article class="product-card">
          <div class="product-visual">
            <strong>${w[1]}</strong>
          </div>
          <div class="product-copy">
            <span class="eyebrow">Home Wires</span>
            <h3>${w[0]}</h3>
            <p>Explore ${w[0]} home wires and available sizes.</p>
            <button class="text-link" onclick="alert('${w[0]} catalogue coming soon')">
              Explore ${w[0]} →
            </button>
          </div>
        </article>
      `).join("");
  </script>

</body>
</html>
